name: Solar Ember Profile Generative Suite

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "dist/**"

permissions:
  contents: write

jobs:
  generate:
    name: Generate Pixel Cat Companion & Solar Ember Snake
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate YourTomo Living Pixel Cat (prsdx/github-pet)
        uses: prsdx/github-pet@v1.3.0
        continue-on-error: true
        with:
          username: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          timezone-offset-minutes: "330"
          display-name: "Bhavya"
          pet-name: "Blaze"
          accent-color: "#f4641b"
          contact-line: "github.com/yoursexybhavya"
          output-dir: "dist"

      - name: Generate Solar Ember Contribution Snake (Platane/snk)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist_snake/github-contribution-grid-snake.svg
            dist_snake/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#f9a41a&color_dots=#180b0d,#4a1812,#8a2b19,#d24c29,#f4641b

      - name: Push Contribution Snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist_snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
