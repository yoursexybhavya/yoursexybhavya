<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c1b" />
      <stop offset="50%" stop-color="#141321" />
      <stop offset="100%" stop-color="#191124" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c192b" />
      <stop offset="50%" stop-color="#161426" />
      <stop offset="100%" stop-color="#1c192b" />
    </linearGradient>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fe428e" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#a9fef7" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#fe428e" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <style>
    .term-font {
      font-family: 'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 13.5px;
    }
    .title-font {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 12.5px;
      font-weight: 600;
      fill: #9ca3af;
    }
    .badge-font {
      font-family: 'Fira Code', 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
    }
    .prompt { fill: #fe428e; font-weight: 700; }
    .path { fill: #a9fef7; font-weight: 700; }
    .cmd { fill: #f8fafc; font-weight: 600; }
    .key { fill: #a9fef7; }
    .val { fill: #f8d47c; }
    .str { fill: #c4b5fd; }
    .muted { fill: #94a3b8; }
    .accent { fill: #fe428e; font-weight: 600; }

    .line-1 { opacity: 0; animation: fadeIn 0.35s ease forwards 0.2s; }
    .line-2 { opacity: 0; animation: fadeIn 0.35s ease forwards 0.6s; }
    .line-3 { opacity: 0; animation: fadeIn 0.35s ease forwards 1.0s; }
    .line-4 { opacity: 0; animation: fadeIn 0.35s ease forwards 1.4s; }
    .line-5 { opacity: 0; animation: fadeIn 0.35s ease forwards 1.8s; }
    .line-6 { opacity: 0; animation: fadeIn 0.35s ease forwards 2.2s; }
    .line-7 { opacity: 0; animation: fadeIn 0.35s ease forwards 2.6s; }
    .line-8 { opacity: 0; animation: fadeIn 0.35s ease forwards 3.0s; }
    .line-9 { opacity: 0; animation: fadeIn 0.35s ease forwards 3.4s; }
    .line-10 { opacity: 0; animation: fadeIn 0.35s ease forwards 3.8s; }

    .cursor {
      animation: blink 1.05s step-end infinite;
      fill: #fe428e;
    }
    .pulse-dot {
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 0.35; }
    }
  </style>

  <!-- Outer Window Frame -->
  <rect x="4" y="4" width="872" height="402" rx="14" ry="14" fill="url(#bgGrad)" stroke="url(#borderGlow)" stroke-width="1.8" />

  <!-- Top Title Bar -->
  <path d="M 5 18 Q 5 5 18 5 L 862 5 Q 875 5 875 18 L 875 44 L 5 44 Z" fill="url(#headerGrad)" />
  <line x1="5" y1="44" x2="875" y2="44" stroke="#2d2640" stroke-width="1.2" />

  <!-- Traffic Lights -->
  <circle cx="26" cy="24.5" r="6.2" fill="#ff5f56" />
  <circle cx="46" cy="24.5" r="6.2" fill="#ffbd2e" />
  <circle cx="66" cy="24.5" r="6.2" fill="#27c93f" />

  <!-- Window Title -->
  <text x="440" y="29" text-anchor="middle" class="title-font">yoursexybhavya@synthwave : ~ (-zsh)</text>

  <!-- Live Status Pill in Title Bar -->
  <rect x="752" y="13.5" width="106" height="22" rx="11" fill="#141321" stroke="#fe428e" stroke-width="1" stroke-opacity="0.7" />
  <circle cx="766" cy="24.5" r="4" fill="#fe428e" class="pulse-dot" />
  <text x="777" y="28.5" class="badge-font" fill="#fe428e">ONLINE • IST</text>

  <!-- Subtle Grid Lines -->
  <g stroke="#fe428e" stroke-opacity="0.035" stroke-width="1">
    <line x1="4" y1="95" x2="876" y2="95" />
    <line x1="4" y1="155" x2="876" y2="155" />
    <line x1="4" y1="215" x2="876" y2="215" />
    <line x1="4" y1="275" x2="876" y2="275" />
    <line x1="4" y1="335" x2="876" y2="335" />
  </g>

  <!-- Terminal Output Content -->
  <g class="term-font">
    <!-- Command 1: whoami -->
    <g class="line-1">
      <text x="26" y="76">
        <tspan class="prompt">bhavya@synthwave</tspan><tspan class="muted">:</tspan><tspan class="path">~</tspan><tspan class="muted">$ </tspan><tspan class="cmd">whoami --verbose</tspan>
      </text>
    </g>

    <g class="line-2">
      <text x="26" y="100">
        <tspan class="accent">&gt; Bhavya Jangid (yoursexybhavya)</tspan><tspan class="muted"> : </tspan><tspan class="val">AI/ML Explorer, Full-Stack Developer &amp; Builder</tspan>
      </text>
      <text x="26" y="121">
        <tspan class="muted">&gt; Building cognitive AI platforms, real-time web systems, and full-stack TypeScript applications.</tspan>
      </text>
    </g>

    <!-- Command 2: cat academic_and_focus.yml -->
    <g class="line-3">
      <text x="26" y="154">
        <tspan class="prompt">bhavya@synthwave</tspan><tspan class="muted">:</tspan><tspan class="path">~/specs</tspan><tspan class="muted">$ </tspan><tspan class="cmd">cat academic_and_focus.yml</tspan>
      </text>
    </g>

    <g class="line-4">
      <text x="26" y="178">
        <tspan class="key">degree     </tspan><tspan class="muted">: </tspan><tspan class="str">"B.Tech in Computer Science (AI &amp; ML) @ JIET Group of Institutions, Jodhpur (2026-2030)"</tspan>
      </text>
    </g>

    <g class="line-5">
      <text x="26" y="200">
        <tspan class="key">focus      </tspan><tspan class="muted">: </tspan><tspan class="str">"Machine Learning, Deep Learning, Full-Stack TypeScript &amp; Systems Engineering"</tspan>
      </text>
    </g>

    <g class="line-6">
      <text x="26" y="222">
        <tspan class="key">philosophy </tspan><tspan class="muted">: </tspan><tspan class="str">"Break things to understand how they work, then rebuild them cleaner and faster"</tspan>
      </text>
    </g>

    <g class="line-7">
      <text x="26" y="244">
        <tspan class="key">mission    </tspan><tspan class="muted">: </tspan><tspan class="str">"Shipping open-source AI tools and high-impact web applications"</tspan>
      </text>
    </g>

    <!-- Command 3: active builds -->
    <g class="line-8">
      <text x="26" y="278">
        <tspan class="prompt">bhavya@synthwave</tspan><tspan class="muted">:</tspan><tspan class="path">~/repositories</tspan><tspan class="muted">$ </tspan><tspan class="cmd">ls -la --featured</tspan>
      </text>
    </g>

    <g class="line-9">
      <text x="26" y="302">
        <tspan class="accent">drwxr-xr-x</tspan><tspan class="muted">  </tspan><tspan class="val">yoursexybhavya/smriti-sathi       </tspan><tspan class="muted"># AI Cognitive Gaming &amp; Memory Platform (SIH26003)</tspan>
      </text>
      <text x="26" y="324">
        <tspan class="accent">drwxr-xr-x</tspan><tspan class="muted">  </tspan><tspan class="val">yoursexybhavya/campus-room-finder </tspan><tspan class="muted"># TypeScript Real-Time Classroom Lookup &amp; Navigator</tspan>
      </text>
      <text x="26" y="346">
        <tspan class="accent">drwxr-xr-x</tspan><tspan class="muted">  </tspan><tspan class="val">yoursexybhavya/yoursexybhavya     </tspan><tspan class="muted"># Automated Profile Suite &amp; Generative Actions</tspan>
      </text>
    </g>

    <!-- Command 4: active prompt with blinking cursor -->
    <g class="line-10">
      <text x="26" y="380">
        <tspan class="prompt">bhavya@synthwave</tspan><tspan class="muted">:</tspan><tspan class="path">~</tspan><tspan class="muted">$ </tspan><tspan class="cmd">./ship_next_build.sh --mode=synthwave </tspan><tspan class="cursor">█</tspan>
      </text>
    </g>
  </g>
</svg>
